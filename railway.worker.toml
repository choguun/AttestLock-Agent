[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @attestlock/shared build && pnpm --filter @attestlock/worker build"
watchPatterns = ["apps/worker/**", "packages/shared/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json"]

[deploy]
startCommand = "pnpm --filter @attestlock/worker start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

[deploy.multiRegionConfig]
"asia-southeast1-eqsg3a" = { numReplicas = 1 }
